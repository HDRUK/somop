name: bunny-daphne

services:
  # --- Dataset 1: COVID-19 Antibody CKD ---
  covid-ckd-a:
    image: ghcr.io/health-informatics-uon/hutch/bunny:edge
    environment:
      DATASOURCE_DB_USERNAME: postgres
      DATASOURCE_DB_PASSWORD: postgres
      DATASOURCE_DB_DATABASE: omop1
      DATASOURCE_DB_DRIVERNAME: postgresql
      DATASOURCE_DB_SCHEMA: public
      DATASOURCE_DB_HOST: host.docker.internal
      DATASOURCE_DB_PORT: 5435
      BUNNY_LOGGER_LEVEL: DEBUG

      TASK_API_BASE_URL: http://host.docker.internal:8100/api/v1
      TASK_API_USERNAME: "${TASK_API_USERNAME:?Set TASK_API_USERNAME to the collection host's client ID}"
      TASK_API_PASSWORD: "${TASK_API_PASSWORD:?Set TASK_API_PASSWORD to the collection host's client secret}"
      TASK_API_ENFORCE_HTTPS: false
      TASK_API_TYPE: a

      COLLECTION_ID: 00000000-0000-0000-0000-000000000000

